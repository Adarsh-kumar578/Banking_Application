name: Banking App CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v3

    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest test_app.py

    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.adarsh578 }}
        password: ${{ secrets.@Abcdefghi0 }}

    - name: Build and Push Docker Image
      run: |
        # Generate unique image tag using the Git short commit SHA
        IMAGE_TAG=${{ github.sha }}
        IMAGE_NAME=${{ secrets.adarsh578 }}/banking-app:$IMAGE_TAG
        
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME
        
        # Save tag dynamically for downstream tracking steps
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV


    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Render Manifest and Deploy to Cluster
      run: |
        # Substitute placeholder template with the runtime unique image tag
        sed "s|DOCKER_IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/deployment.tmpl > k8s/deployment.yaml
        
        # Apply configurations to orchestrate containers
        kubectl apply -f k8s/deployment.yaml
        
        # Force validation rollout tracking
        kubectl rollout status deployment/banking-app
